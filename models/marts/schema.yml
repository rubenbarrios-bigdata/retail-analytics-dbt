version: 2

models:
  - name: fct_orders
    description: "Tabla consolidada de órdenes de venta lista para análisis comercial y tableros en Power BI."
    columns:
      - name: order_id
        description: "Número de orden único."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identificador del cliente que compró."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: net_amount
        description: "Monto neto cobrado al cliente (precio venta menos descuentos)."
        tests:
          - not_null

  - name: dim_customers
    description: "Vista 360 de clientes: consolida historial de compras, valor acumulado y clasificación de clientes para marketing."
    columns:
      - name: customer_id
        description: "Identificador único de cliente."
        tests:
          - unique
          - not_null
      - name: customer_segment
        description: "Clasificación comercial del cliente según su gasto y recurrencia (VIP, Frequent, Active, Prospect)."
        tests:
          - accepted_values:
              arguments:
                values: ['VIP', 'Frequent', 'Active', 'Prospect']

  - name: dim_products
    description: "Catálogo de productos enriquecido con ventas acumuladas, ingresos generados y margen de ganancia."
    columns:
      - name: product_id
        description: "Código único de producto."
        tests:
          - unique
          - not_null
      - name: category
        description: "Categoría comercial a la que pertenece el producto."
        tests:
          - not_null
