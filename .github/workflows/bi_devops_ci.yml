name: BI DevOps & dbt CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate-analytics-stack:
    name: Validate dbt, PBIP (TMDL/PBIR) & Fabric Git Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML Parser
        run: pip install pyyaml

      - name: Run BI DevOps & dbt Integrity Suite
        run: python scripts/validate_bi_devops.py
